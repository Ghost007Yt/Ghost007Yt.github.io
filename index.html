<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Punto de Equilibrio</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Verdana', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .contenedor {
            background-color: #2d2d2d;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #FFD700; /* Color oro como tu título */
            margin-bottom: 25px;
            font-size: 1.5rem;
        }
        .campo {
            margin-bottom: 15px;
            text-align: left;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #555;
            border-radius: 4px;
            background-color: #444;
            color: #fff;
            box-sizing: border-box;
        }
        .botones {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            width: 48%;
        }
        .btn-calcular {
            background-color: #2e7d32;
            color: white;
        }
        .btn-graficar {
            background-color: #c62828;
            color: white;
        }
        .resultados {
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid #555;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="contenedor">
    <h2>PUNTO DE EQUILIBRIO</h2>
    
    <div class="campo">
        <label for="precio">Precio de venta:</label>
        <input type="number" id="precio" placeholder="0.00">
    </div>
    
    <div class="campo">
        <label for="variables">Costos variables:</label>
        <input type="number" id="variables" placeholder="0.00">
    </div>
    
    <div class="campo">
        <label for="fijos">Costos fijos:</label>
        <input type="number" id="fijos" placeholder="0.00">
    </div>
    
    <div class="botones">
        <button class="btn-calcular" onclick="calcularPuntoEquilibrio()">Calcular</button>
        <button class="btn-graficar" onclick="alert('Función de graficar en desarrollo para web')">Graficar</button>
    </div>
    
    <div class="resultados">
        <p><strong>Unidades de equilibrio:</strong> <span id="res-unidades">-</span></p>
        <p><strong>Ventas de equilibrio:</strong> <span id="res-ventas">-</span></p>
    </div>
</div>

<script>
    function calcularPuntoEquilibrio() {
        // Obtener valores de los inputs
        const precio = parseFloat(document.getElementById('precio').value);
        const variables = parseFloat(document.getElementById('variables').value);
        const fijos = parseFloat(document.getElementById('fijos').value);
        
        // Validar entradas
        if (isNaN(precio) || isNaN(variables) || isNaN(fijos)) {
            alert("Por favor, llene todos los campos con números válidos.");
            return;
        }
        
        if (precio <= variables) {
            alert("El precio de venta debe ser mayor que los costos variables.");
            return;
        }
        
        // Fórmulas matemáticas
        const unidades = fijos / (precio - variables);
        const ventas = unidades * precio;
        
        // Mostrar resultados en la pantalla
        document.getElementById('res-unidades').innerText = unidades.toFixed(2);
        document.getElementById('res-ventas').innerText = "$" + ventas.toFixed(2);
    }
</script>

</body>
</html>
